# Local Postgres for development: docker compose -f compose.dev.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bingo_user
      POSTGRES_PASSWORD: bingo
      POSTGRES_DB: bingo
    ports:
      - "5432:5432"
    volumes:
      - bingo-pg:/var/lib/postgresql/data
volumes:
  bingo-pg:
