# CI: lint, typecheck, tests (with a real Postgres for the repository contract),
# build, Docker image build (not pushed).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bingo_user
          POSTGRES_PASSWORD: bingo
          POSTGRES_DB: bingo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bingo_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Lint (biome)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://bingo_user:bingo@127.0.0.1:5432/bingo_test

      - name: Build
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: bingo:ci
